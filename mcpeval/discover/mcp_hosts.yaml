# Hosted MCP endpoints to watch in DNS / proxy / Route 53 Resolver / CASB logs (shadow MCP, network side).
# verified: true  = vendor documentation names this endpoint, or it answered an MCP request on 2026-11-06.
# verified: false = answered like an MCP server when probed but no vendor doc was found; confirm before blocking.
# Start with ALERT (Route 53 DNS Firewall / proxy category), review hits against policy.allowlist, then BLOCK.
patterns:
  - "mcp.*"                                   # host prefix used by most vendors
  - "*.mcp.cloudflare.com"
  - "*.googleapis.com/mcp"                    # Google Cloud managed MCP (70+ services), Workspace *mcp.googleapis.com/mcp/v1
  - "*.crm.dynamics.com/api/mcp"
  - "*.snowflakecomputing.com/api/v2/*/mcp-servers/*"
  - "*/api/2.0/mcp/*"                         # Databricks
  - "*.apim.mcp.workato.com"
  - "*.gateway.bedrock-agentcore.*.amazonaws.com/mcp"   # your own AgentCore gateways
  - "*.azure-api.net"                         # Azure APIM-hosted MCP
  - "*.myshopify.com/api/mcp"
hosts:
  - {host: mcp.notion.com,                vendor: Notion,        verified: true,  paths: [/mcp, /sse]}
  - {host: mcp.linear.app,                vendor: Linear,        verified: true,  paths: [/mcp, /mcp/readonly]}
  - {host: mcp.atlassian.com,             vendor: Atlassian,     verified: true,  paths: [/v2/mcp, /v1/mcp, /v1/sse]}
  - {host: mcp.stripe.com,                vendor: Stripe,        verified: true}
  - {host: api.githubcopilot.com,         vendor: GitHub,        verified: true,  paths: [/mcp/, /mcp/readonly, /mcp/x/, /mcp/insiders]}
  - {host: mcp.sentry.dev,                vendor: Sentry,        verified: true,  paths: [/mcp]}
  - {host: mcp.cloudflare.com,            vendor: Cloudflare,    verified: true,  note: "plus docs|containers|browser|dex|casb|blog .mcp.cloudflare.com and agents.cloudflare.com/mcp"}
  - {host: mcp.zapier.com,                vendor: Zapier,        verified: true}
  - {host: backend.composio.dev,          vendor: Composio,      verified: true,  paths: [/api/v3.1/mcp/]}
  - {host: connect.composio.dev,          vendor: Composio,      verified: true,  paths: [/mcp]}
  - {host: remote.mcp.pipedream.net,      vendor: Pipedream,     verified: true,  paths: [/v3]}
  - {host: mcp.asana.com,                 vendor: Asana,         verified: true,  paths: [/v2/mcp]}
  - {host: mcp.paypal.com,                vendor: PayPal,        verified: true,  paths: [/sse, /http], note: "also mcp.sandbox.paypal.com"}
  - {host: mcp.hubspot.com,               vendor: HubSpot,       verified: true}
  - {host: mcp.intercom.com,              vendor: Intercom,      verified: true,  paths: [/mcp], note: "also mcp.eu.intercom.com"}
  - {host: mcp.figma.com,                 vendor: Figma,         verified: true,  paths: [/mcp], note: "desktop app also listens on 127.0.0.1:3845/mcp"}
  - {host: mcp.vercel.com,                vendor: Vercel,        verified: true}
  - {host: mcp.supabase.com,              vendor: Supabase,      verified: true,  paths: [/mcp]}
  - {host: mcp.neon.tech,                 vendor: Neon,          verified: true,  paths: [/mcp]}
  - {host: mcp.deepwiki.com,              vendor: DeepWiki,      verified: true,  paths: [/mcp]}
  - {host: mcp.context7.com,              vendor: Context7,      verified: true,  paths: [/mcp]}
  - {host: mcp.exa.ai,                    vendor: Exa,           verified: true,  paths: [/mcp]}
  - {host: mcp.firecrawl.dev,             vendor: Firecrawl,     verified: true,  paths: [/v2/mcp, /v2/mcp-oauth]}
  - {host: mcp.tavily.com,                vendor: Tavily,        verified: true,  paths: [/mcp/]}
  - {host: mcp.squareup.com,              vendor: Square,        verified: true,  paths: [/mcp]}
  - {host: mcp.box.com,                   vendor: Box,           verified: true}
