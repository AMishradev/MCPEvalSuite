  # answered like MCP when probed; no vendor doc found
  - {host: mcp.canva.com,                 vendor: Canva,         verified: false, paths: [/mcp]}
  - {host: api.dashboard.plaid.com,       vendor: Plaid,         verified: false, paths: [/mcp/sse]}
  - {host: mcp.dropbox.com,               vendor: Dropbox,       verified: false, paths: [/mcp]}
  - {host: mcp.clickup.com,               vendor: ClickUp,       verified: false, paths: [/mcp]}
  - {host: mcp.airtable.com,              vendor: Airtable,      verified: false, paths: [/mcp]}
  - {host: mcp.wix.com,                   vendor: Wix,           verified: false, paths: [/sse]}
  - {host: mcp.shopify.com,               vendor: Shopify,       verified: false, paths: [/mcp]}
  - {host: mcp.gumloop.com,               vendor: Gumloop,       verified: false}
  - {host: mcp.mercadopago.com,           vendor: Mercado Pago,  verified: false, paths: [/mcp]}
# Registries and marketplaces: DNS hits indicate someone is installing servers.
registries:
  - registry.modelcontextprotocol.io
  - api.mcp.github.com
  - smithery.ai           # hosted proxy server.smithery.ai shut down 2026-10-31; old client entries are dead but prove past use
  - glama.ai
  - pulsemcp.com
  - mcp.so
  - mcpmarket.com
  - hub.docker.com        # /mcp catalog
# Do not add (NXDOMAIN or not MCP as of 2026-11-06): mcp.anthropic.com, mcp.openai.com, mcp.google.com, mcp.salesforce.com, mcp.webflow.com.
# Protocol fingerprints for proxies that see headers (TLS inspection or forward proxy):
fingerprints:
  request_headers: ["MCP-Protocol-Version", "Mcp-Method", "Mcp-Name", "Mcp-Session-Id", "Last-Event-ID"]
  accept: "application/json, text/event-stream"
  well_known_paths: ["/.well-known/oauth-protected-resource", "/.well-known/oauth-authorization-server", "/.well-known/openid-configuration", "/.well-known/mcp-registry-auth", "/.well-known/ai-catalog.json"]
  common_paths: ["/mcp", "/sse", "/messages", "/api/mcp", "/v1/mcp", "/v2/mcp", "/mcp/readonly", "/server-card"]
  jsonrpc_methods: ["server/discover", "initialize", "tools/list", "tools/call", "resources/list", "prompts/list", "subscriptions/listen"]
  legacy_sse_tell: "GET /sse returns text/event-stream whose first event is `event: endpoint`"
