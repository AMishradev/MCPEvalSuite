  - {host: mcp.zoom.us,                   vendor: Zoom,          verified: true,  note: "also mcp-{au,ca,eu,in,sa,sg,us}.zoom.us"}
  - {host: learn.microsoft.com,           vendor: Microsoft,     verified: true,  paths: [/api/mcp]}
  - {host: developers.openai.com,         vendor: OpenAI,        verified: true,  paths: [/mcp]}
  - {host: service.api.aisecurity.paloaltonetworks.com, vendor: Palo Alto, verified: true, paths: [/mcp]}
  - {host: knowledge-mcp.global.api.aws,  vendor: AWS,           verified: true,  note: "AWS Knowledge MCP, unauthenticated"}
  - {host: aws-mcp.us-east-1.api.aws,     vendor: AWS,           verified: true,  note: "managed AWS MCP Server; one host per region aws-mcp.<region>.api.aws"}
