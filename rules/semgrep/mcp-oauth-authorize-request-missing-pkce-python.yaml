rules:
  - id: mcp-oauth-authorize-request-missing-pkce-python
    languages: [python]
    severity: ERROR
    message: >-
      An OAuth authorization request (response_type=code) is being built without a
      PKCE code_challenge. MCP clients MUST implement PKCE (S256) and MUST refuse to
      proceed if the authorization server metadata does not advertise
      code_challenge_methods_supported. Generate a code_verifier, send
      code_challenge + code_challenge_method=S256, and send the RFC 8707 `resource`
      parameter.
    metadata:
      cwe: "CWE-287: Improper Authentication"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [mcp, oauth]
      references:
        - https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization#authorization-code-protection
        - https://www.rfc-editor.org/rfc/rfc8414.html
    patterns:
      - pattern-either:
          - pattern: |
              {..., "response_type": "code", ...}
          - pattern: dict(..., response_type="code", ...)
      - pattern-not: |
          {..., "code_challenge": $C, ...}
      - pattern-not: dict(..., code_challenge=$C, ...)
