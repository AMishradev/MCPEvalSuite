rules:
  - id: mcp-config-env-long-lived-credential
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "*mcp*.json"
        - "claude_desktop_config.json"
        - ".mcp.json"
        - "mcp.json"
        - "*.mcp.json"
    message: >-
      A long-lived credential (AWS access key, GitHub token, Slack token, private
      key, or AWS secret key) is hard-coded in an MCP client configuration `env`
      block. These files are plaintext at a well-known path and are inherited by
      every process the server spawns. Use short-lived credentials (OIDC/STS, OAuth
      with refresh), per-server narrowly scoped tokens, or an OS secret store /
      secret-manager reference. Complements semgrep-rules
      `mcp-hardcoded-config-secret-generic` (which covers sk-/sk-ant-/hf_/AIza).
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [mcp]
      references:
        - https://modelcontextprotocol.io/docs/tutorials/security/local-server-security#isolate-credentials
        - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github#githubs-token-formats
    pattern-either:
      - pattern-regex: '"(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16}"'
      - pattern-regex: '"(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}"'
      - pattern-regex: '"github_pat_[A-Za-z0-9_]{82}"'
      - pattern-regex: '"xox[bpe]-[0-9A-Za-z-]{10,}"'
      - pattern-regex: '"xapp-[0-9]-[A-Z0-9]+-[0-9]+-[a-z0-9]+"'
      - pattern-regex: '"AWS_SECRET_ACCESS_KEY"\s*:\s*"[A-Za-z0-9/+=]{40}"'
      - pattern-regex: '-----BEGIN [A-Z ]*PRIVATE KEY-----'
