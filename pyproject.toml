[project]
name = "mcpeval"
version = "0.1.0"
description = "MCPEvalSuite: AppSec policy-as-code evaluation, CI gate, and shadow-MCP discovery for Model Context Protocol servers"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20",
  "pydantic>=2.7",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
aws = ["boto3>=1.35"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fastmcp>=2.10"]
evals = ["inspect-ai>=0.3.280"]

[project.scripts]
mcpeval = "mcpeval.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcpeval*"]

[tool.setuptools.package-data]
mcpeval = ["policy/*.yaml", "discover/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
